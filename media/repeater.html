<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>HackerAI Repeater</title>
    <style>
        :root {
            --bg: #0d0f0d;
            --bg-panel: #14171a;
            --bg-input: #1c2023;
            --fg: #d4d9d6;
            --fg-dim: #7c8a82;
            --accent: #3794ff;
            --neon: #00ff9c;
            --glitch-red: #ff2b6d;
            --glitch-cyan: #00d9ff;
            --green: #4ec9b0;
            --red: #f44747;
            --yellow: #dcdcaa;
            --border: #262b2e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cascadia Code', 'Fira Code', monospace;
            background: var(--bg);
            color: var(--fg);
            font-size: 13px;
            height: 100vh;
            overflow: hidden;
        }
        button { font-family: inherit; }
        svg { display: block; }
        .icon { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; flex-shrink: 0; }

        .app { display: flex; flex-direction: column; height: 100vh; position: relative; }

        /* Logo */
        .logo {
            width: 24px; height: 24px;
            background: #060706;
            border: 1px solid var(--neon);
            border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            cursor: default;
        }
        .logo-x {
            font-weight: 700;
            font-size: 13px;
            color: var(--neon);
            position: relative;
        }
        .logo-x::before, .logo-x::after {
            content: 'X';
            position: absolute; left: 0; top: 0; width: 100%;
            opacity: 0;
        }
        .logo-x::before { color: var(--glitch-red); }
        .logo-x::after { color: var(--glitch-cyan); }
        @keyframes glitch-run {
            0%, 92%, 100% { transform: translate(0, 0); opacity: 0; }
            93% { transform: translate(-2px, 1px); opacity: 0.85; }
            94% { transform: translate(2px, -1px); opacity: 0.85; }
            95% { transform: translate(-1px, 0); opacity: 0.6; }
            96% { transform: translate(0, 0); opacity: 0; }
        }
        .logo-x::before { animation: glitch-run 5s infinite; }
        .logo-x::after { animation: glitch-run 5s infinite 0.12s; }

        /* Topbar */
        .topbar {
            display: flex;
            gap: 8px;
            padding: 6px 10px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            align-items: center;
            flex-shrink: 0;
        }
        .topbar .title { font-weight: 600; font-size: 12px; letter-spacing: 0.3px; color: var(--fg); margin-right: 4px; }
        .topbar .subtitle { font-size: 10px; color: var(--fg-dim); }
        .icon-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg-dim);
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 3px;
            display: flex; align-items: center; gap: 5px;
            font-size: 11px;
        }
        .icon-btn.hidden { display: none; }
        .icon-btn:hover { color: var(--fg); border-color: var(--accent); }
        .topbar .spacer { margin-left: auto; }
        .mode-toggle {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .mode-btn {
            background: var(--bg-input);
            border: none;
            color: var(--fg-dim);
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
        }
        .mode-btn:hover { color: var(--fg); }
        .mode-btn.active { background: var(--neon); color: #06120c; font-weight: 600; }
        .mode-btn.active[data-mode="agent"] { background: var(--glitch-red); color: #1a0006; }

        select, .field-input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 5px 8px;
            font-size: 12px;
            font-family: inherit;
            border-radius: 3px;
        }

        /* Chat view */
        .chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-empty { color: var(--fg-dim); font-size: 12px; padding: 20px; text-align: center; }

        .chip-row { display: flex; }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(55, 148, 255, 0.12);
            border: 1px solid var(--accent);
            color: #7fbcff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            max-width: 100%;
        }
        .chip:hover { background: rgba(55, 148, 255, 0.22); }
        .chip .chip-count { color: var(--fg-dim); font-size: 10px; }

        .note-row { color: var(--fg-dim); font-size: 11px; padding: 2px 2px; }
        .step-row {
            color: var(--fg-dim); font-size: 10.5px; padding: 3px 8px;
            border-left: 2px solid var(--neon); background: rgba(0,255,156,0.04);
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        }
        .thinking-row { display: flex; }
        .thinking-bubble {
            display: flex; align-items: center; gap: 4px;
            background: var(--bg-panel); border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 6px;
        }
        .thinking-bubble span {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--neon);
            animation: thinking-bounce 1.1s infinite ease-in-out;
        }
        .thinking-bubble span:nth-child(2) { animation-delay: 0.15s; }
        .thinking-bubble span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes thinking-bounce {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-3px); }
        }
        .msg-row { display: flex; }
        .msg-row.user { justify-content: flex-end; }
        .msg-bubble {
            max-width: 85%;
            padding: 7px 11px;
            border-radius: 6px;
            font-size: 12.5px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg-row.user .msg-bubble { background: var(--accent); color: #fff; }
        .msg-row.assistant .msg-bubble { background: var(--bg-panel); border: 1px solid var(--border); }

        .result-entry {
            border: 1px solid var(--border);
            background: var(--bg-panel);
            border-radius: 4px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .result-entry:hover { border-color: var(--accent); }
        .result-entry .result-title { color: var(--fg-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
        .result-entry .result-summary { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .status-2xx { color: var(--green); }
        .status-3xx { color: var(--yellow); }
        .status-4xx, .status-5xx { color: var(--red); }
        .status-err { color: var(--red); }
        .status-pending { color: var(--fg-dim); }

        .confirm-entry {
            border: 1px solid var(--glitch-red);
            background: rgba(255, 43, 109, 0.08);
            border-radius: 4px;
            padding: 8px 10px;
            font-size: 12px;
        }
        .confirm-label { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; margin-bottom: 6px; word-break: break-word; }
        .confirm-actions { display: flex; gap: 6px; }
        .confirm-status { font-size: 11px; font-weight: 600; }
        .confirm-status.approved { color: var(--green); }
        .confirm-status.denied { color: var(--red); }

        /* Command menu */
        .command-menu {
            margin: 0 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            overflow: hidden;
        }
        .command-item {
            padding: 7px 12px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .command-item:last-child { border-bottom: none; }
        .command-item:hover { background: var(--bg-input); }
        .command-item .cmd-name { color: var(--neon); font-weight: 600; }
        .command-item .cmd-desc { color: var(--fg-dim); }

        /* Input bar */
        .input-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
            flex-shrink: 0;
        }
        .input-bar input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 7px 10px;
            font-size: 12px;
            font-family: inherit;
            border-radius: 4px;
        }
        .input-bar input:focus { outline: 1px solid var(--accent); }
        .round-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg-dim);
            width: 30px; height: 30px;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .round-btn:hover { color: var(--fg); border-color: var(--accent); }
        .round-btn.send { background: var(--accent); color: #fff; border-color: var(--accent); }
        .round-btn.send:hover { filter: brightness(1.15); }
        .round-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Builder bar (composing /url /headers /body /plugins /api) */
        .builder-bar {
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
            padding: 8px 10px;
            flex-shrink: 0;
        }
        .builder-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--fg-dim); margin-bottom: 6px; }
        .builder-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
        .builder-tag {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--bg-input); border: 1px solid var(--border);
            padding: 3px 6px 3px 8px; border-radius: 3px; font-size: 11px;
            max-width: 260px;
        }
        .builder-tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .builder-tag button { background: none; border: none; color: var(--fg-dim); cursor: pointer; display: flex; }
        .builder-tag button:hover { color: var(--red); }
        .builder-row { display: flex; gap: 6px; align-items: center; }
        .builder-row input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 6px 8px;
            font-size: 12px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            border-radius: 3px;
            min-width: 60px;
        }
        .builder-actions { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
        .text-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 5px 12px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            display: flex; align-items: center; gap: 5px;
        }
        .text-btn:hover { border-color: var(--accent); }
        .text-btn.hidden { display: none; }
        .text-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .text-btn.primary:hover { filter: brightness(1.15); }
        .text-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Full-screen views (results / tools) */
        .fullscreen-view {
            position: absolute; inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .fullscreen-view.hidden { display: none; }
        .fs-header {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
            flex-shrink: 0;
        }
        .fs-header .fs-title { font-size: 12px; color: var(--fg-dim); }
        .fs-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
        .fs-item { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .fs-item-head {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            padding: 8px 10px; background: var(--bg-panel); font-size: 12px;
        }
        .fs-item-head .method { color: var(--accent); font-weight: 700; }
        .fs-item-head .url { color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 100px; }
        .fs-section { padding: 8px 10px; border-top: 1px solid var(--border); }
        .fs-section summary { cursor: pointer; font-size: 11px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.4px; }
        .fs-section pre {
            margin-top: 6px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 260px;
            overflow-y: auto;
        }

        /* Tools view */
        .tools-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }
        .tools-section { display: flex; flex-direction: column; gap: 8px; }
        .tools-section h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--fg-dim); }
        .tools-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .tools-row label { display: flex; align-items: center; gap: 5px; font-size: 12px; }
        .banner {
            display: flex; align-items: center; gap: 6px;
            background: #3a2a10; color: var(--yellow);
            font-size: 10px; line-height: 1.4; padding: 6px 8px; border-radius: 3px;
        }
        .gate { display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
        .gate label { display: flex; align-items: flex-start; gap: 6px; }
        .ai-output {
            padding: 8px 10px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            min-height: 60px;
        }
        .ai-output .ai-error { color: var(--red); }
        .ai-output .ai-loading { color: var(--fg-dim); }
        .ai-tokens { font-size: 10px; color: var(--fg-dim); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }
    </style>
</head>
<body>
    <div class="app">
        <div class="topbar">
            <div class="logo" id="logo">
                <span class="logo-x">X</span>
            </div>
            <span class="title">HackerAI Repeater</span>
            <div class="spacer"></div>
            <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn" id="askModeBtn" title="Ask: chat only, no autonomous actions">Ask</button>
                <button class="mode-btn" id="agentModeBtn" data-mode="agent" title="Agent: AI can call tools and act on its own">Agent</button>
            </div>
            <button class="icon-btn" id="toolsToggleBtn" title="Tools">
                <svg class="icon" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6a1.5 1.5 0 0 0 2 2l6-6a4 4 0 0 0 5.4-5.4l-2.1 2.1-2-2 2.1-2.1Z"/></svg>
                Tools
            </button>
        </div>

        <div class="chat-view" id="chatView">
            <div class="chat-log" id="chatLog"></div>

            <div class="command-menu" id="commandMenu" hidden></div>

            <div class="builder-bar" id="builderBar" hidden>
                <div class="builder-label" id="builderLabel"></div>
                <div class="builder-tags" id="builderTags"></div>
                <div class="builder-row" id="builderRow"></div>
                <div class="builder-actions">
                    <button class="text-btn hidden" id="builderResetBtn">Reset to default</button>
                    <button class="text-btn" id="builderCancelBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
                        Cancel
                    </button>
                    <button class="text-btn primary" id="builderOkBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
                        OK
                    </button>
                </div>
            </div>

            <div class="command-menu" id="confirmMenu" hidden></div>
            <div class="input-bar" id="inputBar">
                <button class="round-btn" id="plusBtn" title="Commands">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button class="round-btn" id="confirmModeBtn" title="AI action mode">#</button>
                <input id="chatInput" placeholder="Type / for commands, or @ to send" spellcheck="false">
                <button class="round-btn send" id="sendBtn" title="Send (@)">
                    <svg class="icon" viewBox="0 0 24 24" stroke="#fff"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
                </button>
            </div>
        </div>

        <div class="fullscreen-view hidden" id="resultsView">
            <div class="fs-header">
                <button class="icon-btn" id="resultsBackBtn" title="Back to chat">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Back
                </button>
                <span class="fs-title" id="fsTitle">Results</span>
            </div>
            <div class="fs-body" id="fsBody"></div>
        </div>

        <div class="fullscreen-view hidden" id="toolsView">
            <div class="fs-header">
                <button class="icon-btn" id="toolsBackBtn" title="Back to chat">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Back
                </button>
                <span class="fs-title">Tools</span>
            </div>
            <div class="tools-body">
                <div class="tools-section">
                    <h3>Request settings</h3>
                    <div class="tools-row">
                        <label>Method
                            <select id="method">
                                <option>GET</option><option>POST</option><option>PUT</option>
                                <option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option>
                            </select>
                        </label>
                        <label><input type="checkbox" id="followRedirects" checked> Follow redirects</label>
                    </div>
                </div>

                <div class="tools-section">
                    <h3>AI assistant</h3>
                    <div class="banner">
                        <svg class="icon" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
                        Authorized security testing only — review AI output before acting on it.
                    </div>
                    <div class="gate" id="aiGate">
                        <label>
                            <input type="checkbox" id="aiAuthCheckbox">
                            <span>I confirm I am authorized to test the target(s) I use this assistant against, and I take responsibility for how I use its output.</span>
                        </label>
                        <button class="text-btn primary" id="aiEnableBtn" disabled style="align-self:flex-start">Enable AI Assistant</button>
                    </div>
                    <div id="aiMain" style="display:none; flex-direction:column; gap:8px">
                        <div class="tools-row">
                            <button class="text-btn" id="aiSuggestBtn">Suggest payload for request</button>
                            <button class="text-btn" id="aiAnalyzeBtn">Analyze last response</button>
                        </div>
                        <div class="ai-output" id="aiOutput">Ask for a payload suggestion or a response analysis, or just chat in the main view — the AI can drive /url, /headers, /body and sending on its own.</div>
                        <div class="ai-tokens" id="aiTokens"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        // ---------- DOM refs ----------
        const toolsToggleBtn = document.getElementById('toolsToggleBtn');
        const askModeBtn = document.getElementById('askModeBtn');
        const agentModeBtn = document.getElementById('agentModeBtn');
        const chatLogEl = document.getElementById('chatLog');
        const commandMenu = document.getElementById('commandMenu');
        const builderBar = document.getElementById('builderBar');
        const builderLabel = document.getElementById('builderLabel');
        const builderTags = document.getElementById('builderTags');
        const builderRow = document.getElementById('builderRow');
        const builderOkBtn = document.getElementById('builderOkBtn');
        const builderCancelBtn = document.getElementById('builderCancelBtn');
        const builderResetBtn = document.getElementById('builderResetBtn');
        const inputBar = document.getElementById('inputBar');
        const chatInput = document.getElementById('chatInput');
        const plusBtn = document.getElementById('plusBtn');
        const sendBtn = document.getElementById('sendBtn');
        const confirmModeBtn = document.getElementById('confirmModeBtn');
        const confirmMenu = document.getElementById('confirmMenu');
        const resultsView = document.getElementById('resultsView');
        const toolsView = document.getElementById('toolsView');
        const fsTitle = document.getElementById('fsTitle');
        const fsBody = document.getElementById('fsBody');
        const methodEl = document.getElementById('method');
        const followRedirects = document.getElementById('followRedirects');

        const aiGate = document.getElementById('aiGate');
        const aiAuthCheckbox = document.getElementById('aiAuthCheckbox');
        const aiEnableBtn = document.getElementById('aiEnableBtn');
        const aiMain = document.getElementById('aiMain');
        const aiSuggestBtn = document.getElementById('aiSuggestBtn');
        const aiAnalyzeBtn = document.getElementById('aiAnalyzeBtn');
        const aiOutput = document.getElementById('aiOutput');
        const aiTokens = document.getElementById('aiTokens');

        // ---------- State ----------
        const STORE_KEY = 'hackeraiRepeaterState';
        const COMMANDS = [
            { name: 'url', desc: 'Add one or more target URLs' },
            { name: 'headers', desc: 'Add request headers' },
            { name: 'body', desc: 'Set the request body' },
            { name: 'output', desc: 'Toggle the AI step-by-step log' },
            { name: 'plugins', desc: 'Link external tool plugins' },
            { name: 'api', desc: 'Connect Claude or another AI/API' },
            { name: 'prompt', desc: 'Edit the AI\'s system prompt' },
        ];
        const BUILDER_META = {
            url: { label: 'Add target URL(s)', placeholder: 'https://example.com/api/endpoint' },
            headers: { label: 'Add header(s)', placeholder: 'Header-Name: value' },
            body: { label: 'Set body', placeholder: 'Request body content' },
            plugins: { label: 'Add plugin(s)', fields: [
                { key: 'name', placeholder: 'Plugin name' },
                { key: 'url', placeholder: 'https://your-plugin-endpoint' },
            ] },
            api: { label: 'Connect an API (name + key -- verified automatically; only the first entry is used)', fields: [
                { key: 'name', placeholder: 'openai / claude / openrouter / groq / mistral / ...' },
                { key: 'apiKey', placeholder: 'API key' },
                { key: 'baseUrl', placeholder: 'Base URL (only for a custom/unknown provider)' },
                { key: 'model', placeholder: 'Model override (optional)' },
            ] },
            prompt: { label: 'Edit the system prompt -- applies to every reply on this device from now on', isPrompt: true },
        };

        const DEFAULT_SYSTEM_PROMPT = 'You are Xenos, an AI assistant embedded in a VS Code HTTP repeater tool for authorized security testing. ' +
            'You can call tools to set the target URL(s), headers, body, send HTTP requests, read/write files, list directories, and run ' +
            'terminal commands (terminal commands always need explicit user approval first, regardless of mode). ' +
            'Keep your own working notes, plans, and context in a "hacker" folder at the workspace root (e.g. hacker/NOTES.md), the way ' +
            'Claude Code keeps a .claude folder. Only act on targets and files the user has authorized. Keep replies concise.';

        function loadState() {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                if (raw) return JSON.parse(raw);
            } catch {}
            return {
                chatLog: [],
                versionCounters: { url: 0, headers: 0, body: 0, plugins: 0, api: 0 },
                activeChipId: { url: null, headers: null, body: null, plugins: null, api: null },
                showOutput: false,
                mode: 'ask',
                agentHistory: [{
                    role: 'system',
                    content: DEFAULT_SYSTEM_PROMPT,
                }],
            };
        }
        const state = loadState();
        if (!state.mode) state.mode = 'ask';
        if (!state.confirmMode) state.confirmMode = 'automated';
        if (!state.activeChipId.plugins) state.activeChipId.plugins = state.activeChipId.plugins || null;
        if (!state.activeChipId.api) state.activeChipId.api = state.activeChipId.api || null;
        if (state.versionCounters.plugins == null) state.versionCounters.plugins = 0;
        if (state.versionCounters.api == null) state.versionCounters.api = 0;
        if (!Array.isArray(state.agentHistory) || !state.agentHistory.length) {
            state.agentHistory = [{ role: 'system', content: DEFAULT_SYSTEM_PROMPT }];
        }
        let lastResponseForAI = null;
        let pendingRequests = {};   // requestId -> { entryId, index }
        let entryResolvers = {};   // entryId -> resolve callback (used by the agent's send_request tool)
        let llmPending = {};       // requestId -> resolve
        let pluginPending = {};    // requestId -> resolve
        let apiValidatePending = {}; // requestId -> resolve
        let fsPending = {};        // requestId -> resolve
        let terminalPending = {};  // requestId -> resolve
        let pendingConfirms = {};  // confirm entry id -> resolve(approved)

        function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
        function slug(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'plugin'; }
        function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

        // ---------- Rendering ----------
        function findChip(id) { return state.chatLog.find(e => e.id === id && e.kind === 'chip'); }

        function tagLabel(type, item) {
            if (typeof item === 'string') return item;
            if (type === 'plugins') return item.name || item.url || 'plugin';
            if (type === 'api') return item.name || 'API';
            return JSON.stringify(item);
        }

        function renderChatLog() {
            chatLogEl.innerHTML = '';
            const visible = state.chatLog.filter(e => e.kind !== 'step' || state.showOutput);
            if (visible.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'chat-empty';
                empty.textContent = 'Chat with the AI, or type / to add a URL, headers, body, plugins, or an API — then @ or the send button to fire the request.';
                chatLogEl.appendChild(empty);
            }
            visible.forEach(entry => {
                if (entry.kind === 'chip') chatLogEl.appendChild(renderChip(entry));
                else if (entry.kind === 'note') { const d = document.createElement('div'); d.className = 'note-row'; d.textContent = entry.text; chatLogEl.appendChild(d); }
                else if (entry.kind === 'step') { const d = document.createElement('div'); d.className = 'step-row'; d.textContent = entry.text; chatLogEl.appendChild(d); }
                else if (entry.kind === 'result') chatLogEl.appendChild(renderResultEntry(entry));
                else if (entry.kind === 'confirm') chatLogEl.appendChild(renderConfirmEntry(entry));
                else if (entry.kind === 'user' || entry.kind === 'assistant') chatLogEl.appendChild(renderMsg(entry));
            });
            if (thinking) {
                const row = document.createElement('div');
                row.className = 'thinking-row';
                row.innerHTML = '<div class="thinking-bubble"><span></span><span></span><span></span></div>';
                chatLogEl.appendChild(row);
            }
            chatLogEl.scrollTop = chatLogEl.scrollHeight;
        }
        let thinking = false;
        function setThinking(v) { thinking = v; renderChatLog(); }

        function renderMsg(entry) {
            const row = document.createElement('div');
            row.className = 'msg-row ' + entry.kind;
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.textContent = entry.text;
            row.appendChild(bubble);
            return row;
        }

        function renderChip(entry) {
            const row = document.createElement('div');
            row.className = 'chip-row';
            const chip = document.createElement('div');
            chip.className = 'chip';
            const label = entry.type.charAt(0).toUpperCase() + entry.type.slice(1);
            chip.innerHTML = `<span>${label} v${entry.version}</span><span class="chip-count">${entry.items.length} item${entry.items.length === 1 ? '' : 's'}</span>`;
            chip.addEventListener('click', () => openBuilder(entry.type, entry.id));
            row.appendChild(chip);
            return row;
        }

        function statusClass(item) {
            if (item.error) return 'status-err';
            if (item.pending) return 'status-pending';
            const c = String(item.statusCode || '')[0];
            return `status-${c}xx`;
        }

        function renderResultEntry(entry) {
            const div = document.createElement('div');
            div.className = 'result-entry';
            const done = entry.items.filter(i => !i.pending).length;
            const title = document.createElement('div');
            title.className = 'result-title';
            title.textContent = `${entry.method} · ${entry.items.length} request${entry.items.length === 1 ? '' : 's'} · ${done}/${entry.items.length} done`;
            const summary = document.createElement('div');
            summary.className = 'result-summary';
            entry.items.forEach(item => {
                const span = document.createElement('span');
                span.className = statusClass(item);
                span.textContent = item.pending ? '…' : (item.error ? 'ERR' : String(item.statusCode));
                summary.appendChild(span);
            });
            div.appendChild(title);
            div.appendChild(summary);
            div.addEventListener('click', () => openResultsView(entry));
            return div;
        }

        function renderConfirmEntry(entry) {
            const div = document.createElement('div');
            div.className = 'confirm-entry';
            const label = document.createElement('div');
            label.className = 'confirm-label';
            label.textContent = `${entry.name}(${entry.args})`;
            div.appendChild(label);
            if (entry.resolved) {
                const status = document.createElement('div');
                status.className = entry.approved ? 'confirm-status approved' : 'confirm-status denied';
                status.textContent = entry.approved ? 'Approved' : 'Denied';
                div.appendChild(status);
            } else {
                const actions = document.createElement('div');
                actions.className = 'confirm-actions';
                const acceptBtn = document.createElement('button');
                acceptBtn.className = 'text-btn primary'; acceptBtn.textContent = 'Accept';
                acceptBtn.addEventListener('click', () => pendingConfirms[entry.id] && pendingConfirms[entry.id](true));
                const denyBtn = document.createElement('button');
                denyBtn.className = 'text-btn'; denyBtn.textContent = 'Deny';
                denyBtn.addEventListener('click', () => pendingConfirms[entry.id] && pendingConfirms[entry.id](false));
                actions.appendChild(acceptBtn); actions.appendChild(denyBtn);
                div.appendChild(actions);
            }
            return div;
        }

        // ---------- Navigation ----------
        function anyFullscreenOpen() {
            return !resultsView.classList.contains('hidden') || !toolsView.classList.contains('hidden');
        }
        function closeFullscreens() {
            resultsView.classList.add('hidden');
            toolsView.classList.add('hidden');
        }
        function openResultsView(entry) {
            toolsView.classList.add('hidden');
            fsTitle.textContent = `${entry.method} · ${entry.items.length} request${entry.items.length === 1 ? '' : 's'}`;
            fsBody.innerHTML = '';
            entry.items.forEach(item => fsBody.appendChild(renderFsItem(entry.method, item)));
            resultsView.classList.remove('hidden');
        }
        function openToolsView() {
            resultsView.classList.add('hidden');
            toolsView.classList.remove('hidden');
        }
        document.getElementById('resultsBackBtn').addEventListener('click', closeFullscreens);
        document.getElementById('toolsBackBtn').addEventListener('click', closeFullscreens);
        toolsToggleBtn.addEventListener('click', openToolsView);

        function renderFsItem(method, item) {
            const wrap = document.createElement('div');
            wrap.className = 'fs-item';
            const head = document.createElement('div');
            head.className = 'fs-item-head';
            if (item.pending) {
                head.innerHTML = `<span class="method">${method}</span><span class="url">${item.url}</span><span class="status-pending">pending…</span>`;
            } else if (item.error) {
                head.innerHTML = `<span class="method">${method}</span><span class="url">${item.url}</span><span class="status-err">${escapeHtml(item.error)}</span>`;
            } else {
                const cls = statusClass(item);
                head.innerHTML = `<span class="method">${method}</span><span class="url">${item.url}</span>` +
                    `<span class="${cls}">${item.statusCode} ${item.statusMessage || ''}</span>` +
                    `<span style="color:var(--fg-dim)">${item.timing || 0}ms</span>` +
                    `<span style="color:var(--fg-dim)">${(item.body || '').length} bytes</span>`;
            }
            wrap.appendChild(head);
            if (!item.pending && !item.error) {
                const reqSection = document.createElement('details');
                reqSection.className = 'fs-section';
                reqSection.innerHTML = `<summary>Response headers</summary><pre>${escapeHtml(JSON.stringify(item.headers || {}, null, 2))}</pre>`;
                wrap.appendChild(reqSection);
                const bodySection = document.createElement('details');
                bodySection.className = 'fs-section';
                bodySection.open = true;
                let bodyText = item.body || '';
                try { bodyText = JSON.stringify(JSON.parse(bodyText), null, 2); } catch {}
                bodySection.innerHTML = `<summary>Response body</summary><pre>${escapeHtml(bodyText)}</pre>`;
                wrap.appendChild(bodySection);
            }
            return wrap;
        }

        // ---------- Command menu ----------
        function showCommandMenu(filterText) {
            const matches = COMMANDS.filter(c => c.name.startsWith(filterText));
            if (matches.length === 0) { hideCommandMenu(); return; }
            commandMenu.innerHTML = '';
            matches.forEach(c => {
                const item = document.createElement('div');
                item.className = 'command-item';
                item.innerHTML = `<span class="cmd-name">/${c.name}</span><span class="cmd-desc">${c.desc}</span>`;
                item.addEventListener('click', () => { chatInput.value = ''; hideCommandMenu(); runCommand(c.name); });
                commandMenu.appendChild(item);
            });
            commandMenu.hidden = false;
        }
        function hideCommandMenu() { commandMenu.hidden = true; commandMenu.innerHTML = ''; }

        // ---------- AI action mode (# button): Manual asks before every tool call, Automated doesn't ----------
        const CONFIRM_MODES = [
            { name: 'manual', label: 'Manual', desc: 'Every AI action asks for your OK first' },
            { name: 'automated', label: 'Automated', desc: 'Actions run immediately (terminal always still asks)' },
        ];
        function renderConfirmModeBtn() {
            confirmModeBtn.title = `AI action mode: ${state.confirmMode === 'manual' ? 'Manual' : 'Automated'} (click to change)`;
            confirmModeBtn.style.color = state.confirmMode === 'manual' ? 'var(--yellow)' : '';
        }
        function toggleConfirmMenu() {
            if (!confirmMenu.hidden) { confirmMenu.hidden = true; confirmMenu.innerHTML = ''; return; }
            confirmMenu.innerHTML = '';
            CONFIRM_MODES.forEach(m => {
                const item = document.createElement('div');
                item.className = 'command-item';
                item.innerHTML = `<span class="cmd-name">${m.label}</span><span class="cmd-desc">${m.desc}</span>`;
                item.addEventListener('click', () => {
                    state.confirmMode = m.name;
                    saveState();
                    renderConfirmModeBtn();
                    confirmMenu.hidden = true;
                    confirmMenu.innerHTML = '';
                });
                confirmMenu.appendChild(item);
            });
            confirmMenu.hidden = false;
        }
        confirmModeBtn.addEventListener('click', toggleConfirmMenu);
        renderConfirmModeBtn();

        function runCommand(name) {
            if (name === 'output') {
                state.showOutput = !state.showOutput;
                saveState();
                renderChatLog();
                return;
            }
            openBuilder(name, null);
        }

        let promptTextarea = null;

        // ---------- Builder (compose /url /headers /body /plugins /api) ----------
        let builder = null; // { type, chipId, items }
        let builderInputs = []; // live DOM input refs for the current row

        function openBuilder(type, chipId) {
            let items = [];
            if (type === 'prompt') {
                items = [state.agentHistory[0].content];
            } else if (chipId) {
                const chip = findChip(chipId);
                if (chip) items = chip.items.slice();
            }
            builder = { type, chipId, items };
            builderLabel.textContent = BUILDER_META[type].label + (chipId ? ` (editing v${findChip(chipId).version})` : '');
            builderResetBtn.classList.toggle('hidden', type !== 'prompt');
            renderBuilderTags();
            renderBuilderRow();
            inputBar.hidden = true;
            hideCommandMenu();
            builderBar.hidden = false;
        }
        builderResetBtn.addEventListener('click', () => {
            if (promptTextarea) promptTextarea.value = DEFAULT_SYSTEM_PROMPT;
        });
        function closeBuilder() {
            builder = null;
            builderBar.hidden = true;
            inputBar.hidden = false;
            chatInput.value = '';
            chatInput.focus();
        }
        function renderBuilderTags() {
            builderTags.innerHTML = '';
            if (BUILDER_META[builder.type].isPrompt) return;
            builder.items.forEach((val, idx) => {
                const tag = document.createElement('div');
                tag.className = 'builder-tag';
                const span = document.createElement('span');
                span.textContent = tagLabel(builder.type, val);
                const btn = document.createElement('button');
                btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" style="width:11px;height:11px"><path d="M18 6 6 18M6 6l12 12"/></svg>';
                btn.addEventListener('click', () => { builder.items.splice(idx, 1); renderBuilderTags(); });
                tag.appendChild(span); tag.appendChild(btn);
                builderTags.appendChild(tag);
            });
        }
        function renderBuilderRow() {
            const meta = BUILDER_META[builder.type];
            builderRow.innerHTML = '';
            builderInputs = [];
            promptTextarea = null;
            if (meta.isPrompt) {
                promptTextarea = document.createElement('textarea');
                promptTextarea.value = builder.items[0] || '';
                promptTextarea.rows = 6;
                promptTextarea.style.cssText = 'flex:1;background:var(--bg-input);border:1px solid var(--border);color:var(--fg);padding:8px;font-size:12px;font-family:inherit;border-radius:3px;resize:vertical;';
                builderRow.appendChild(promptTextarea);
                promptTextarea.focus();
                return;
            }
            const specs = meta.fields || [{ key: 'value', placeholder: meta.placeholder }];
            specs.forEach((f, i) => {
                const inp = document.createElement('input');
                inp.placeholder = f.placeholder;
                inp.spellcheck = false;
                inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); builderAddCurrent(); } });
                builderInputs.push(inp);
                builderRow.appendChild(inp);
            });
            const addBtn = document.createElement('button');
            addBtn.className = 'round-btn'; addBtn.title = 'Add';
            addBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
            addBtn.addEventListener('click', builderAddCurrent);
            builderRow.appendChild(addBtn);
            if (builderInputs[0]) builderInputs[0].focus();
        }
        function builderAddCurrent() {
            const meta = BUILDER_META[builder.type];
            if (meta.fields) {
                const obj = {};
                meta.fields.forEach((f, i) => { obj[f.key] = (builderInputs[i].value || '').trim(); });
                if (!Object.values(obj).some(v => v)) return;
                builder.items.push(obj);
            } else {
                const val = (builderInputs[0].value || '').trim();
                if (!val) return;
                builder.items.push(val);
            }
            renderBuilderTags();
            renderBuilderRow();
        }
        builderCancelBtn.addEventListener('click', closeBuilder);
        function validateApiConfig(item) {
            return new Promise((resolve) => {
                const requestId = uid();
                apiValidatePending[requestId] = resolve;
                vscode.postMessage({ type: 'apiValidate', requestId, name: item.name, apiKey: item.apiKey, baseUrl: item.baseUrl });
            });
        }

        builderOkBtn.addEventListener('click', () => {
            if (!builder) return;
            if (BUILDER_META[builder.type].isPrompt) {
                state.agentHistory[0].content = (promptTextarea.value || '').trim() || DEFAULT_SYSTEM_PROMPT;
                saveState();
                state.chatLog.push({ id: uid(), kind: 'note', text: 'System prompt updated -- applies from here on.' });
                saveState();
                renderChatLog();
                closeBuilder();
                return;
            }
            builderAddCurrent();
            const { type, chipId, items } = builder;
            let chip;
            if (chipId) {
                chip = findChip(chipId);
                chip.items = items;
            } else {
                state.versionCounters[type] += 1;
                chip = { id: uid(), kind: 'chip', type, version: state.versionCounters[type], items };
                state.chatLog.push(chip);
                state.activeChipId[type] = chip.id;
            }
            saveState();
            renderChatLog();
            closeBuilder();

            if (type === 'api' && chip.items[0] && chip.items[0].name) {
                const item = chip.items[0];
                logStep(`Verifying API "${item.name}"…`);
                validateApiConfig(item).then(res => {
                    item.kind = res.kind || item.kind;
                    item.baseUrl = item.baseUrl || res.baseUrl;
                    item.model = item.model || res.defaultModel;
                    logStep(res.message);
                    saveState();
                    renderChatLog();
                });
            }
        });

        // ---------- Chat input: '/' menu, '@' send, plain text = chat with AI ----------
        chatInput.addEventListener('input', () => {
            const val = chatInput.value;
            if (val.startsWith('/')) showCommandMenu(val.slice(1).toLowerCase());
            else hideCommandMenu();
            if (val === '@') { chatInput.value = ''; hideCommandMenu(); sendBatch(); }
        });
        chatInput.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            const val = chatInput.value.trim();
            if (!val) return;
            if (val.startsWith('/')) {
                const name = val.slice(1).toLowerCase();
                if (COMMANDS.some(c => c.name === name)) {
                    chatInput.value = ''; hideCommandMenu(); runCommand(name);
                    return;
                }
            }
            chatInput.value = ''; hideCommandMenu();
            if (val === '@') { sendBatch(); return; }
            if (state.mode === 'agent') runAgent(val); else runAsk(val);
        });
        plusBtn.addEventListener('click', () => { chatInput.value = '/'; showCommandMenu(''); chatInput.focus(); });
        sendBtn.addEventListener('click', () => { chatInput.value = ''; hideCommandMenu(); sendBatch(); });

        // ---------- Ask/Agent mode ----------
        function renderMode() {
            askModeBtn.classList.toggle('active', state.mode === 'ask');
            agentModeBtn.classList.toggle('active', state.mode === 'agent');
        }
        askModeBtn.addEventListener('click', () => { state.mode = 'ask'; saveState(); renderMode(); });
        agentModeBtn.addEventListener('click', () => {
            if (!aiIsAuthorized()) {
                state.chatLog.push({ id: uid(), kind: 'note', text: 'Enable the AI assistant in Tools first, then switch to Agent mode.' });
                saveState(); renderChatLog();
                return;
            }
            state.mode = 'agent'; saveState(); renderMode();
        });
        renderMode();

        async function runAsk(userText) {
            // Ask mode never gets the HTTP/plugin tools (those stay Agent-only), but once
            // authorized it can read/write files and run terminal commands -- the latter
            // always confirms first regardless, so it's not truly tool-free anymore.
            const tools = aiIsAuthorized() ? [...fsTools(), ...terminalTools()] : [];
            await runChatTurn(userText, tools);
        }

        // ---------- Direct sending (manual @ / send button) ----------
        function sendBatch(methodOverride) {
            const urlChipId = state.activeChipId.url;
            const urlChip = urlChipId ? findChip(urlChipId) : null;
            const urls = urlChip ? urlChip.items : [];
            if (urls.length === 0) {
                state.chatLog.push({ id: uid(), kind: 'note', text: 'No URL set — use /url first.' });
                saveState(); renderChatLog();
                return;
            }
            const headersChip = state.activeChipId.headers ? findChip(state.activeChipId.headers) : null;
            const bodyChip = state.activeChipId.body ? findChip(state.activeChipId.body) : null;
            const headersText = headersChip ? headersChip.items.join('\n') : '';
            const bodyText = bodyChip ? bodyChip.items.join('\n') : '';
            const method = methodOverride || methodEl.value;
            const entry = { id: uid(), kind: 'result', method, items: urls.map(u => ({ url: u, pending: true, requestId: uid() })) };
            state.chatLog.push(entry);
            saveState(); renderChatLog();
            entry.items.forEach((item, index) => {
                pendingRequests[item.requestId] = { entryId: entry.id, index };
                vscode.postMessage({ type: 'sendRequest', requestId: item.requestId, method, url: item.url, headers: headersText, body: bodyText, followRedirects: followRedirects.checked });
            });
        }

        // Awaitable variant used by the agent's send_request tool.
        function sendBatchAwait(methodOverride) {
            return new Promise((resolve) => {
                const urlChipId = state.activeChipId.url;
                const urlChip = urlChipId ? findChip(urlChipId) : null;
                const urls = urlChip ? urlChip.items : [];
                if (urls.length === 0) { resolve({ error: 'No URL set — use /url or the set_url tool first.' }); return; }
                const headersChip = state.activeChipId.headers ? findChip(state.activeChipId.headers) : null;
                const bodyChip = state.activeChipId.body ? findChip(state.activeChipId.body) : null;
                const headersText = headersChip ? headersChip.items.join('\n') : '';
                const bodyText = bodyChip ? bodyChip.items.join('\n') : '';
                const method = methodOverride || methodEl.value;
                const entry = { id: uid(), kind: 'result', method, items: urls.map(u => ({ url: u, pending: true, requestId: uid() })) };
                state.chatLog.push(entry);
                saveState(); renderChatLog();
                let remaining = entry.items.length;
                entryResolvers[entry.id] = () => {
                    remaining--;
                    if (remaining <= 0) {
                        delete entryResolvers[entry.id];
                        resolve({ requests: entry.items.map(i => i.error ? { url: i.url, error: i.error } : { url: i.url, statusCode: i.statusCode, bytes: (i.body || '').length }) });
                    }
                };
                entry.items.forEach((item, index) => {
                    pendingRequests[item.requestId] = { entryId: entry.id, index };
                    vscode.postMessage({ type: 'sendRequest', requestId: item.requestId, method, url: item.url, headers: headersText, body: bodyText, followRedirects: followRedirects.checked });
                });
            });
        }

        // ---------- Messages from extension ----------
        window.addEventListener('message', (event) => {
            const msg = event.data;
            if (msg.type === 'response') {
                const pending = pendingRequests[msg.requestId];
                if (!pending) return;
                delete pendingRequests[msg.requestId];
                const entry = state.chatLog.find(e => e.id === pending.entryId);
                if (!entry) return;
                const item = entry.items[pending.index];
                item.pending = false;
                if (msg.data.error) item.error = msg.data.error;
                else { Object.assign(item, msg.data); lastResponseForAI = msg.data; }
                saveState(); renderChatLog();
                if (!resultsView.classList.contains('hidden') && fsTitle.textContent.startsWith(entry.method)) openResultsView(entry);
                if (entryResolvers[entry.id]) entryResolvers[entry.id]();

            } else if (msg.type === 'llmResult') {
                const resolve = llmPending[msg.requestId];
                if (resolve) { delete llmPending[msg.requestId]; resolve(msg.data); }

            } else if (msg.type === 'pluginResult') {
                const resolve = pluginPending[msg.requestId];
                if (resolve) { delete pluginPending[msg.requestId]; resolve(msg.data); }

            } else if (msg.type === 'apiValidateResult') {
                const resolve = apiValidatePending[msg.requestId];
                if (resolve) { delete apiValidatePending[msg.requestId]; resolve(msg.data); }

            } else if (msg.type === 'fsResult') {
                const resolve = fsPending[msg.requestId];
                if (resolve) { delete fsPending[msg.requestId]; resolve(msg.data); }

            } else if (msg.type === 'terminalResult') {
                const resolve = terminalPending[msg.requestId];
                if (resolve) { delete terminalPending[msg.requestId]; resolve(msg.data); }

            } else if (msg.type === 'loadRequest') {
                loadRawRequest(msg.data);
            }
        });

        function loadRawRequest(raw) {
            const lines = raw.split('\n');
            let method = 'GET', url = '', headerLines = [], bodyLines = [];
            const firstLine = lines[0] && lines[0].match(/^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\s+(\S+)/i);
            if (firstLine) {
                method = firstLine[1].toUpperCase();
                url = firstLine[2];
                let inBody = false;
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') { inBody = true; continue; }
                    if (inBody) bodyLines.push(lines[i]); else headerLines.push(lines[i]);
                }
            } else { url = raw.trim(); }
            methodEl.value = method;
            if (url) {
                state.versionCounters.url += 1;
                const entry = { id: uid(), kind: 'chip', type: 'url', version: state.versionCounters.url, items: [url] };
                state.chatLog.push(entry); state.activeChipId.url = entry.id;
            }
            if (headerLines.length) {
                state.versionCounters.headers += 1;
                const entry = { id: uid(), kind: 'chip', type: 'headers', version: state.versionCounters.headers, items: headerLines };
                state.chatLog.push(entry); state.activeChipId.headers = entry.id;
            }
            if (bodyLines.length) {
                state.versionCounters.body += 1;
                const entry = { id: uid(), kind: 'chip', type: 'body', version: state.versionCounters.body, items: [bodyLines.join('\n')] };
                state.chatLog.push(entry); state.activeChipId.body = entry.id;
            }
            saveState(); renderChatLog();
        }

        // ---------- LLM plumbing (local Ollama, or a connected /api) ----------
        function getActiveApiConfig() {
            const chip = state.activeChipId.api ? findChip(state.activeChipId.api) : null;
            if (!chip || !chip.items.length) return null;
            const item = chip.items[0];
            if (!item.baseUrl || !item.apiKey) return null;
            return { kind: item.kind === 'anthropic' ? 'anthropic' : 'openai', baseUrl: item.baseUrl, apiKey: item.apiKey, model: item.model };
        }
        function callLLMAsync(messages, tools) {
            return new Promise((resolve) => {
                const requestId = uid();
                llmPending[requestId] = resolve;
                vscode.postMessage({ type: 'llmCall', requestId, messages, tools, apiConfig: getActiveApiConfig(), model: 'xenos' });
            });
        }
        function callPluginAsync(url, args) {
            return new Promise((resolve) => {
                const requestId = uid();
                pluginPending[requestId] = resolve;
                vscode.postMessage({ type: 'pluginCall', requestId, url, args });
            });
        }

        // ---------- Agent: tools + loop ----------
        function builtinTools() {
            return [
                { type: 'function', function: { name: 'set_url', description: 'Set the target URL(s) for the next HTTP request (creates a new URL version).', parameters: { type: 'object', properties: { urls: { type: 'array', items: { type: 'string' } } }, required: ['urls'] } } },
                { type: 'function', function: { name: 'set_headers', description: 'Set request headers for the next HTTP request.', parameters: { type: 'object', properties: { headers: { type: 'array', items: { type: 'string' } } }, required: ['headers'] } } },
                { type: 'function', function: { name: 'set_body', description: 'Set the request body for the next HTTP request.', parameters: { type: 'object', properties: { body: { type: 'string' } }, required: ['body'] } } },
                { type: 'function', function: { name: 'send_request', description: 'Send the currently configured HTTP request(s) using the active URL/headers/body, and return status/bytes for each.', parameters: { type: 'object', properties: { method: { type: 'string', description: 'HTTP method, defaults to the method selected in Tools.' } } } } },
            ];
        }
        function pluginTools() {
            const chip = state.activeChipId.plugins ? findChip(state.activeChipId.plugins) : null;
            if (!chip) return [];
            return chip.items.filter(p => p.name && p.url).map(p => ({
                type: 'function',
                function: { name: 'plugin_' + slug(p.name), description: `Call the external plugin "${p.name}".`, parameters: { type: 'object', properties: { input: { type: 'string' } }, required: ['input'] } },
            }));
        }
        function fsTools() {
            return [
                { type: 'function', function: { name: 'list_directory', description: 'List files and folders at a path relative to the open workspace folder.', parameters: { type: 'object', properties: { path: { type: 'string', description: 'Relative path; defaults to the workspace root.' } } } } },
                { type: 'function', function: { name: 'read_file', description: 'Read a text file relative to the open workspace folder.', parameters: { type: 'object', properties: { path: { type: 'string' } }, required: ['path'] } } },
                { type: 'function', function: { name: 'write_file', description: 'Create or overwrite a text file relative to the open workspace folder, creating parent folders as needed.', parameters: { type: 'object', properties: { path: { type: 'string' }, content: { type: 'string' } }, required: ['path', 'content'] } } },
            ];
        }
        function terminalTools() {
            return [
                { type: 'function', function: { name: 'run_terminal_command', description: 'Run a shell command in the open workspace folder. Always asks for your approval first, regardless of the current AI action mode.', parameters: { type: 'object', properties: { command: { type: 'string' } }, required: ['command'] } } },
            ];
        }
        function callFsAsync(op, path, content) {
            return new Promise((resolve) => {
                const requestId = uid();
                fsPending[requestId] = resolve;
                vscode.postMessage({ type: 'fsCall', requestId, op, path, content });
            });
        }
        function callTerminalAsync(command) {
            return new Promise((resolve) => {
                const requestId = uid();
                terminalPending[requestId] = resolve;
                vscode.postMessage({ type: 'terminalCall', requestId, command });
            });
        }
        // Confirmation gate: renders an Accept/Deny chat entry and waits for the user's click.
        function requestConfirm(call) {
            return new Promise((resolve) => {
                const id = uid();
                addChatEntry({ kind: 'confirm', id, name: call.name, args: call.arguments || '', resolved: false });
                pendingConfirms[id] = (approved) => {
                    const entry = state.chatLog.find(e => e.id === id);
                    if (entry) { entry.resolved = true; entry.approved = approved; saveState(); renderChatLog(); }
                    delete pendingConfirms[id];
                    resolve(approved);
                };
            });
        }
        async function executeTool(call) {
            let args = {};
            try { args = call.arguments ? JSON.parse(call.arguments) : {}; } catch {}
            if (call.name === 'set_url') {
                state.versionCounters.url++;
                const entry = { id: uid(), kind: 'chip', type: 'url', version: state.versionCounters.url, items: args.urls || [] };
                state.chatLog.push(entry); state.activeChipId.url = entry.id; saveState(); renderChatLog();
                return { ok: true, created: `URL v${entry.version}`, items: entry.items };
            }
            if (call.name === 'set_headers') {
                state.versionCounters.headers++;
                const entry = { id: uid(), kind: 'chip', type: 'headers', version: state.versionCounters.headers, items: args.headers || [] };
                state.chatLog.push(entry); state.activeChipId.headers = entry.id; saveState(); renderChatLog();
                return { ok: true, created: `Headers v${entry.version}` };
            }
            if (call.name === 'set_body') {
                state.versionCounters.body++;
                const entry = { id: uid(), kind: 'chip', type: 'body', version: state.versionCounters.body, items: [args.body || ''] };
                state.chatLog.push(entry); state.activeChipId.body = entry.id; saveState(); renderChatLog();
                return { ok: true, created: `Body v${entry.version}` };
            }
            if (call.name === 'send_request') return await sendBatchAwait(args.method);
            if (call.name === 'list_directory') return await callFsAsync('list_directory', args.path);
            if (call.name === 'read_file') return await callFsAsync('read_file', args.path);
            if (call.name === 'write_file') return await callFsAsync('write_file', args.path, args.content);
            if (call.name === 'run_terminal_command') return await callTerminalAsync(args.command);
            if (call.name.startsWith('plugin_')) {
                const chip = state.activeChipId.plugins ? findChip(state.activeChipId.plugins) : null;
                const plugin = chip && chip.items.find(p => 'plugin_' + slug(p.name) === call.name);
                if (!plugin) return { error: 'Plugin not found — check /plugins.' };
                return await callPluginAsync(plugin.url, args);
            }
            return { error: `Unknown tool ${call.name}` };
        }
        function logStep(text) { state.chatLog.push({ id: uid(), kind: 'step', text }); saveState(); renderChatLog(); }
        function addChatEntry(entry) { state.chatLog.push(Object.assign({ id: uid() }, entry)); saveState(); renderChatLog(); }

        // Shared by Ask (file/terminal tools only) and Agent (everything) -- the only
        // difference between modes is which tools get offered, not this loop itself.
        async function runChatTurn(userText, tools) {
            addChatEntry({ kind: 'user', text: userText });
            state.agentHistory.push({ role: 'user', content: userText });
            if (state.agentHistory.length > 20) state.agentHistory = [state.agentHistory[0], ...state.agentHistory.slice(-19)];
            let iterations = 0;
            setThinking(true);
            while (iterations < 4) {
                iterations++;
                logStep(`Thinking… (step ${iterations}, can take a while on CPU)`);
                const result = await callLLMAsync(state.agentHistory, tools);
                if (result.error) {
                    setThinking(false);
                    logStep(`Error: ${result.error}`);
                    addChatEntry({ kind: 'assistant', text: 'Error: ' + result.error });
                    saveState();
                    return;
                }
                if (result.toolCalls && result.toolCalls.length) {
                    state.agentHistory.push({
                        role: 'assistant', content: result.content || '',
                        tool_calls: result.toolCalls.map(tc => ({ id: tc.id, type: 'function', function: { name: tc.name, arguments: tc.arguments } })),
                    });
                    for (const call of result.toolCalls) {
                        const needsConfirm = state.confirmMode === 'manual' || call.name === 'run_terminal_command';
                        if (needsConfirm) {
                            const approved = await requestConfirm(call);
                            if (!approved) {
                                logStep(`${call.name} denied by user`);
                                state.agentHistory.push({ role: 'tool', tool_call_id: call.id, content: JSON.stringify({ error: 'Denied by user' }) });
                                continue;
                            }
                        }
                        logStep(`Calling ${call.name}(${call.arguments || ''})`);
                        let toolResult;
                        try { toolResult = await executeTool(call); } catch (err) { toolResult = { error: err.message }; }
                        logStep(`${call.name} -> ${JSON.stringify(toolResult).slice(0, 200)}`);
                        state.agentHistory.push({ role: 'tool', tool_call_id: call.id, content: JSON.stringify(toolResult) });
                    }
                    saveState();
                    continue;
                }
                setThinking(false);
                state.agentHistory.push({ role: 'assistant', content: result.content || '' });
                addChatEntry({ kind: 'assistant', text: result.content || '(no response)' });
                if (result.promptTokens != null || result.responseTokens != null) {
                    logStep(`${(result.promptTokens || 0) + (result.responseTokens || 0)} tokens used`);
                }
                saveState();
                return;
            }
            setThinking(false);
            addChatEntry({ kind: 'assistant', text: '(stopped after too many tool steps — try a simpler request)' });
        }

        async function runAgent(userText) {
            if (!aiIsAuthorized()) {
                addChatEntry({ kind: 'user', text: userText });
                addChatEntry({ kind: 'assistant', text: 'Agent mode needs the AI assistant enabled in Tools first.' });
                return;
            }
            await runChatTurn(userText, [...builtinTools(), ...fsTools(), ...terminalTools(), ...pluginTools()]);
        }

        // ---------- AI assistant gate + one-off actions (in Tools) ----------
        const AI_AUTH_KEY = 'hackeraiRepeaterAiAuthorized';
        function aiIsAuthorized() { return localStorage.getItem(AI_AUTH_KEY) === 'true'; }
        function aiShowMain() { aiGate.style.display = 'none'; aiMain.style.display = 'flex'; }
        if (aiIsAuthorized()) aiShowMain();
        aiAuthCheckbox.addEventListener('change', () => { aiEnableBtn.disabled = !aiAuthCheckbox.checked; });
        aiEnableBtn.addEventListener('click', () => {
            if (!aiAuthCheckbox.checked) return;
            localStorage.setItem(AI_AUTH_KEY, 'true');
            aiShowMain();
        });

        async function runOneOff(prompt) {
            aiSuggestBtn.disabled = true; aiAnalyzeBtn.disabled = true;
            aiOutput.innerHTML = '<span class="ai-loading">Thinking… (can take a while on CPU)</span>';
            aiTokens.textContent = '';
            const result = await callLLMAsync([...state.agentHistory.slice(0, 1), { role: 'user', content: prompt }], []);
            aiSuggestBtn.disabled = false; aiAnalyzeBtn.disabled = false;
            if (result.error) { aiOutput.innerHTML = `<span class="ai-error">${escapeHtml(result.error)}</span>`; return; }
            aiOutput.textContent = result.content;
            if (result.promptTokens != null || result.responseTokens != null) {
                const total = (result.promptTokens || 0) + (result.responseTokens || 0);
                aiTokens.textContent = `${total} tokens (${result.promptTokens || 0} prompt + ${result.responseTokens || 0} response)`;
            }
        }
        aiSuggestBtn.addEventListener('click', () => {
            const urlChip = state.activeChipId.url ? findChip(state.activeChipId.url) : null;
            if (!urlChip || urlChip.items.length === 0) { aiOutput.innerHTML = '<span class="ai-error">No URL set — use /url first.</span>'; return; }
            const headersChip = state.activeChipId.headers ? findChip(state.activeChipId.headers) : null;
            const bodyChip = state.activeChipId.body ? findChip(state.activeChipId.body) : null;
            runOneOff(`Suggest a security-testing payload variant for this HTTP request. Explain briefly why each suggested change is worth trying.\n\n` +
                `Method: ${methodEl.value}\nURL(s):\n${urlChip.items.join('\n')}\nHeaders:\n${headersChip ? headersChip.items.join('\n') : '(none)'}\n\nBody:\n${bodyChip ? bodyChip.items.join('\n') : '(none)'}`);
        });
        aiAnalyzeBtn.addEventListener('click', () => {
            if (!lastResponseForAI) { aiOutput.innerHTML = '<span class="ai-error">No response yet — send a request first.</span>'; return; }
            runOneOff(`Analyze this HTTP response for potential vulnerabilities or interesting behavior (e.g. reflected input, verbose errors, misconfigurations). Be specific.\n\n` +
                `Status: ${lastResponseForAI.statusCode} ${lastResponseForAI.statusMessage}\nHeaders:\n${JSON.stringify(lastResponseForAI.headers, null, 2)}\n\nBody:\n${(lastResponseForAI.body || '').slice(0, 8000)}`);
        });

        // ---------- Initial render ----------
        renderChatLog();
    </script>
</body>
</html>
