<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>HackerAI Repeater</title>
    <style>
        :root {
            --bg: #0d0f0d;
            --bg-panel: #14171a;
            --bg-input: #1c2023;
            --fg: #d4d9d6;
            --fg-dim: #7c8a82;
            --accent: #3794ff;
            --neon: #00ff9c;
            --glitch-red: #ff2b6d;
            --glitch-cyan: #00d9ff;
            --green: #4ec9b0;
            --red: #f44747;
            --yellow: #dcdcaa;
            --border: #262b2e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cascadia Code', 'Fira Code', monospace;
            background: var(--bg);
            color: var(--fg);
            font-size: 13px;
            height: 100vh;
            overflow: hidden;
        }
        button { font-family: inherit; }
        svg { display: block; }
        .icon { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; flex-shrink: 0; }

        .app { display: flex; flex-direction: column; height: 100vh; }

        /* Logo */
        .logo {
            width: 24px; height: 24px;
            background: #060706;
            border: 1px solid var(--neon);
            border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .logo-x {
            font-weight: 700;
            font-size: 13px;
            color: var(--neon);
            position: relative;
        }
        .logo-x::before, .logo-x::after {
            content: 'X';
            position: absolute; left: 0; top: 0; width: 100%;
            opacity: 0;
        }
        .logo-x::before { color: var(--glitch-red); }
        .logo-x::after { color: var(--glitch-cyan); }
        @keyframes glitch-run {
            0%, 92%, 100% { transform: translate(0, 0); opacity: 0; }
            93% { transform: translate(-2px, 1px); opacity: 0.85; }
            94% { transform: translate(2px, -1px); opacity: 0.85; }
            95% { transform: translate(-1px, 0); opacity: 0.6; }
            96% { transform: translate(0, 0); opacity: 0; }
        }
        .logo-x::before { animation: glitch-run 5s infinite; }
        .logo-x::after { animation: glitch-run 5s infinite 0.12s; }

        /* Topbar */
        .topbar {
            display: flex;
            gap: 8px;
            padding: 6px 10px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            align-items: center;
            flex-shrink: 0;
        }
        .topbar .title { font-weight: 600; font-size: 12px; letter-spacing: 0.3px; color: var(--fg); margin-right: 4px; }
        .topbar label { color: var(--fg-dim); font-size: 11px; display: flex; align-items: center; gap: 4px; }
        .topbar select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 3px 8px;
            font-size: 12px;
            font-family: inherit;
        }
        .icon-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg-dim);
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 3px;
            display: flex; align-items: center; gap: 5px;
            font-size: 11px;
        }
        .icon-btn:hover { color: var(--fg); border-color: var(--accent); }
        .icon-btn.active { color: var(--neon); border-color: var(--neon); }
        .topbar .spacer { margin-left: auto; }

        /* Chat view */
        .chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-empty { color: var(--fg-dim); font-size: 12px; padding: 20px; text-align: center; }

        .chip-row { display: flex; }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(55, 148, 255, 0.12);
            border: 1px solid var(--accent);
            color: #7fbcff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            max-width: 100%;
        }
        .chip:hover { background: rgba(55, 148, 255, 0.22); }
        .chip .chip-count { color: var(--fg-dim); font-size: 10px; }

        .note-row { color: var(--fg-dim); font-size: 11px; padding: 2px 2px; }

        .result-entry {
            border: 1px solid var(--border);
            background: var(--bg-panel);
            border-radius: 4px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .result-entry:hover { border-color: var(--accent); }
        .result-entry .result-title { color: var(--fg-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
        .result-entry .result-summary { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .status-2xx { color: var(--green); }
        .status-3xx { color: var(--yellow); }
        .status-4xx, .status-5xx { color: var(--red); }
        .status-err { color: var(--red); }
        .status-pending { color: var(--fg-dim); }

        /* Command menu */
        .command-menu {
            margin: 0 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            overflow: hidden;
        }
        .command-item {
            padding: 7px 12px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .command-item:last-child { border-bottom: none; }
        .command-item:hover, .command-item.sel { background: var(--bg-input); }
        .command-item .cmd-name { color: var(--neon); font-weight: 600; }
        .command-item .cmd-desc { color: var(--fg-dim); }

        /* Input bar */
        .input-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
            flex-shrink: 0;
        }
        .input-bar input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 7px 10px;
            font-size: 12px;
            font-family: inherit;
            border-radius: 4px;
        }
        .input-bar input:focus { outline: 1px solid var(--accent); }
        .round-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg-dim);
            width: 30px; height: 30px;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .round-btn:hover { color: var(--fg); border-color: var(--accent); }
        .round-btn.send { background: var(--accent); color: #fff; border-color: var(--accent); }
        .round-btn.send:hover { filter: brightness(1.15); }
        .round-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Builder bar (composing /url /headers /body) */
        .builder-bar {
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
            padding: 8px 10px;
            flex-shrink: 0;
        }
        .builder-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--fg-dim); margin-bottom: 6px; }
        .builder-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
        .builder-tag {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--bg-input); border: 1px solid var(--border);
            padding: 3px 6px 3px 8px; border-radius: 3px; font-size: 11px;
            max-width: 260px;
        }
        .builder-tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .builder-tag button { background: none; border: none; color: var(--fg-dim); cursor: pointer; display: flex; }
        .builder-tag button:hover { color: var(--red); }
        .builder-row { display: flex; gap: 6px; align-items: center; }
        .builder-row input, .builder-row textarea {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 6px 8px;
            font-size: 12px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            border-radius: 3px;
        }
        .builder-row textarea { resize: vertical; min-height: 50px; }
        .builder-actions { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
        .text-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 5px 12px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            display: flex; align-items: center; gap: 5px;
        }
        .text-btn:hover { border-color: var(--accent); }
        .text-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .text-btn.primary:hover { filter: brightness(1.15); }

        /* Full-screen result view */
        .fullscreen-view {
            position: absolute; inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .fullscreen-view.hidden { display: none; }
        .fs-header {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-panel);
            flex-shrink: 0;
        }
        .fs-header .fs-title { font-size: 12px; color: var(--fg-dim); }
        .fs-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
        .fs-item { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .fs-item-head {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            padding: 8px 10px; background: var(--bg-panel); font-size: 12px;
        }
        .fs-item-head .method { color: var(--accent); font-weight: 700; }
        .fs-item-head .url { color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 100px; }
        .fs-section { padding: 8px 10px; border-top: 1px solid var(--border); }
        .fs-section summary { cursor: pointer; font-size: 11px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.4px; }
        .fs-section pre {
            margin-top: 6px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 260px;
            overflow-y: auto;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }

        /* AI panel */
        .ai-panel {
            flex-shrink: 0;
            height: 180px;
            max-height: 40vh;
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
        }
        .ai-panel.collapsed { display: none; }
        .ai-banner {
            display: flex; align-items: center; gap: 6px;
            background: #3a2a10;
            color: var(--yellow);
            font-size: 10px;
            line-height: 1.4;
            padding: 4px 10px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .ai-gate {
            padding: 10px 14px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ai-gate label { display: flex; align-items: flex-start; gap: 6px; }
        .ai-gate button:disabled { opacity: 0.5; cursor: not-allowed; }
        .ai-main { display: flex; flex-direction: column; flex: 1; min-height: 0; }
        .ai-toolbar { display: flex; gap: 6px; padding: 4px 10px; flex-shrink: 0; align-items: center; }
        .ai-toolbar select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--fg);
            font-size: 11px;
            padding: 3px 6px;
            margin-left: auto;
        }
        .ai-output {
            flex: 1;
            overflow: auto;
            padding: 8px 10px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .ai-output .ai-error { color: var(--red); }
        .ai-output .ai-loading { color: var(--fg-dim); }
        .ai-tokens { padding: 3px 10px 6px; font-size: 10px; color: var(--fg-dim); flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="app">
        <div class="topbar">
            <div class="logo" aria-hidden="true"><span class="logo-x">X</span></div>
            <span class="title">HackerAI Repeater</span>
            <label>Method
                <select id="method">
                    <option>GET</option>
                    <option>POST</option>
                    <option>PUT</option>
                    <option>PATCH</option>
                    <option>DELETE</option>
                    <option>HEAD</option>
                    <option>OPTIONS</option>
                </select>
            </label>
            <label><input type="checkbox" id="followRedirects" checked> Follow redirects</label>
            <div class="spacer"></div>
            <button class="icon-btn" id="aiToggleBtn" title="AI assistant">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="4"/></svg>
                AI
            </button>
        </div>

        <div class="chat-view" id="chatView">
            <div class="chat-log" id="chatLog"></div>

            <div class="command-menu" id="commandMenu" hidden></div>

            <div class="builder-bar" id="builderBar" hidden>
                <div class="builder-label" id="builderLabel"></div>
                <div class="builder-tags" id="builderTags"></div>
                <div class="builder-row" id="builderRow">
                    <input id="builderInput" placeholder="" spellcheck="false">
                    <button class="round-btn" id="builderAddBtn" title="Add">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>
                <div class="builder-actions">
                    <button class="text-btn" id="builderCancelBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
                        Cancel
                    </button>
                    <button class="text-btn primary" id="builderOkBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
                        OK
                    </button>
                </div>
            </div>

            <div class="input-bar" id="inputBar">
                <button class="round-btn" id="plusBtn" title="Commands">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <input id="chatInput" placeholder="Type / for commands, or @ to send" spellcheck="false">
                <button class="round-btn send" id="sendBtn" title="Send (@)">
                    <svg class="icon" viewBox="0 0 24 24" stroke="#fff"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
                </button>
            </div>
        </div>

        <div class="fullscreen-view hidden" id="fullscreenView">
            <div class="fs-header">
                <button class="round-btn" id="fsBackBtn" title="Back">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <span class="fs-title" id="fsTitle">Results</span>
            </div>
            <div class="fs-body" id="fsBody"></div>
        </div>

        <div class="ai-panel collapsed" id="aiPanel">
            <div class="ai-banner">
                <svg class="icon" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
                Authorized security testing only — review AI output before acting on it.
            </div>
            <div class="ai-gate" id="aiGate">
                <label>
                    <input type="checkbox" id="aiAuthCheckbox">
                    <span>I confirm I am authorized to test the target(s) I use this assistant against, and I take responsibility for how I use its output.</span>
                </label>
                <button class="text-btn primary" id="aiEnableBtn" disabled style="align-self:flex-start">Enable AI Assistant</button>
            </div>
            <div class="ai-main" id="aiMain" style="display:none">
                <div class="ai-toolbar">
                    <button class="text-btn" id="aiSuggestBtn">Suggest payload for request</button>
                    <button class="text-btn" id="aiAnalyzeBtn">Analyze last response</button>
                    <select id="aiModel">
                        <option value="xenos">xenos</option>
                    </select>
                </div>
                <div class="ai-output" id="aiOutput">Ask for a payload suggestion or a response analysis above.</div>
                <div class="ai-tokens" id="aiTokens"></div>
            </div>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        // ---------- DOM refs ----------
        const methodEl = document.getElementById('method');
        const followRedirects = document.getElementById('followRedirects');
        const chatLogEl = document.getElementById('chatLog');
        const commandMenu = document.getElementById('commandMenu');
        const builderBar = document.getElementById('builderBar');
        const builderLabel = document.getElementById('builderLabel');
        const builderTags = document.getElementById('builderTags');
        const builderInput = document.getElementById('builderInput');
        const builderAddBtn = document.getElementById('builderAddBtn');
        const builderOkBtn = document.getElementById('builderOkBtn');
        const builderCancelBtn = document.getElementById('builderCancelBtn');
        const inputBar = document.getElementById('inputBar');
        const chatInput = document.getElementById('chatInput');
        const plusBtn = document.getElementById('plusBtn');
        const sendBtn = document.getElementById('sendBtn');
        const fullscreenView = document.getElementById('fullscreenView');
        const fsBackBtn = document.getElementById('fsBackBtn');
        const fsTitle = document.getElementById('fsTitle');
        const fsBody = document.getElementById('fsBody');

        const aiToggleBtn = document.getElementById('aiToggleBtn');
        const aiPanel = document.getElementById('aiPanel');
        const aiGate = document.getElementById('aiGate');
        const aiAuthCheckbox = document.getElementById('aiAuthCheckbox');
        const aiEnableBtn = document.getElementById('aiEnableBtn');
        const aiMain = document.getElementById('aiMain');
        const aiSuggestBtn = document.getElementById('aiSuggestBtn');
        const aiAnalyzeBtn = document.getElementById('aiAnalyzeBtn');
        const aiModel = document.getElementById('aiModel');
        const aiOutput = document.getElementById('aiOutput');
        const aiTokens = document.getElementById('aiTokens');

        // ---------- State ----------
        const STORE_KEY = 'hackeraiRepeaterState';
        const COMMANDS = [
            { name: 'url', desc: 'Add one or more target URLs' },
            { name: 'headers', desc: 'Add request headers' },
            { name: 'body', desc: 'Set the request body' },
        ];

        function loadState() {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                if (raw) return JSON.parse(raw);
            } catch {}
            return { chatLog: [], versionCounters: { url: 0, headers: 0, body: 0 }, activeChipId: { url: null, headers: null, body: null } };
        }
        const state = loadState();
        let lastResponseForAI = null; // {statusCode, statusMessage, headers, body}
        let pendingRequests = {}; // requestId -> { entryId, index }

        function saveState() {
            localStorage.setItem(STORE_KEY, JSON.stringify(state));
        }

        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        // ---------- Icons ----------
        function chevron() {
            return '<svg class="icon" viewBox="0 0 24 24" style="width:11px;height:11px"><path d="m9 18 6-6-6-6"/></svg>';
        }

        // ---------- Rendering ----------
        function findChip(id) {
            return state.chatLog.find(e => e.id === id && e.kind === 'chip');
        }

        function renderChatLog() {
            chatLogEl.innerHTML = '';
            if (state.chatLog.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'chat-empty';
                empty.textContent = 'Type / to add a URL, headers, or body — then @ or the send button to fire the request.';
                chatLogEl.appendChild(empty);
            }
            state.chatLog.forEach(entry => {
                if (entry.kind === 'chip') {
                    chatLogEl.appendChild(renderChip(entry));
                } else if (entry.kind === 'note') {
                    const div = document.createElement('div');
                    div.className = 'note-row';
                    div.textContent = entry.text;
                    chatLogEl.appendChild(div);
                } else if (entry.kind === 'result') {
                    chatLogEl.appendChild(renderResultEntry(entry));
                }
            });
            chatLogEl.scrollTop = chatLogEl.scrollHeight;
        }

        function renderChip(entry) {
            const row = document.createElement('div');
            row.className = 'chip-row';
            const chip = document.createElement('div');
            chip.className = 'chip';
            const label = entry.type.charAt(0).toUpperCase() + entry.type.slice(1);
            chip.innerHTML = `<span>${label} v${entry.version}</span><span class="chip-count">${entry.items.length} item${entry.items.length === 1 ? '' : 's'}</span>`;
            chip.addEventListener('click', () => openBuilder(entry.type, entry.id));
            row.appendChild(chip);
            return row;
        }

        function statusClass(item) {
            if (item.error) return 'status-err';
            if (item.pending) return 'status-pending';
            const c = String(item.statusCode || '')[0];
            return `status-${c}xx`;
        }

        function renderResultEntry(entry) {
            const div = document.createElement('div');
            div.className = 'result-entry';
            const done = entry.items.filter(i => !i.pending).length;
            const title = document.createElement('div');
            title.className = 'result-title';
            title.textContent = `${entry.method} · ${entry.items.length} request${entry.items.length === 1 ? '' : 's'} · ${done}/${entry.items.length} done`;
            const summary = document.createElement('div');
            summary.className = 'result-summary';
            entry.items.forEach(item => {
                const span = document.createElement('span');
                span.className = statusClass(item);
                span.textContent = item.pending ? '…' : (item.error ? 'ERR' : String(item.statusCode));
                summary.appendChild(span);
            });
            div.appendChild(title);
            div.appendChild(summary);
            div.addEventListener('click', () => openFullscreen(entry));
            return div;
        }

        // ---------- Command menu ----------
        function showCommandMenu(filterText) {
            const matches = COMMANDS.filter(c => c.name.startsWith(filterText));
            if (matches.length === 0) { hideCommandMenu(); return; }
            commandMenu.innerHTML = '';
            matches.forEach(c => {
                const item = document.createElement('div');
                item.className = 'command-item';
                item.innerHTML = `<span class="cmd-name">/${c.name}</span><span class="cmd-desc">${c.desc}</span>`;
                item.addEventListener('click', () => {
                    chatInput.value = '';
                    hideCommandMenu();
                    openBuilder(c.name, null);
                });
                commandMenu.appendChild(item);
            });
            commandMenu.hidden = false;
        }
        function hideCommandMenu() {
            commandMenu.hidden = true;
            commandMenu.innerHTML = '';
        }

        // ---------- Builder (compose /url /headers /body) ----------
        let builder = null; // { type, chipId, items }

        const BUILDER_META = {
            url: { label: 'Add target URL(s)', placeholder: 'https://example.com/api/endpoint' },
            headers: { label: 'Add header(s)', placeholder: 'Header-Name: value' },
            body: { label: 'Set body', placeholder: 'Request body content' },
        };

        function openBuilder(type, chipId) {
            let items = [];
            if (chipId) {
                const chip = findChip(chipId);
                if (chip) items = chip.items.slice();
            }
            builder = { type, chipId, items };
            builderLabel.textContent = BUILDER_META[type].label + (chipId ? ` (editing v${findChip(chipId).version})` : '');
            builderInput.placeholder = BUILDER_META[type].placeholder;
            builderInput.value = '';
            renderBuilderTags();
            inputBar.hidden = true;
            hideCommandMenu();
            builderBar.hidden = false;
            builderInput.focus();
        }

        function closeBuilder() {
            builder = null;
            builderBar.hidden = true;
            inputBar.hidden = false;
            chatInput.value = '';
            chatInput.focus();
        }

        function renderBuilderTags() {
            builderTags.innerHTML = '';
            builder.items.forEach((val, idx) => {
                const tag = document.createElement('div');
                tag.className = 'builder-tag';
                const span = document.createElement('span');
                span.textContent = val;
                const btn = document.createElement('button');
                btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" style="width:11px;height:11px"><path d="M18 6 6 18M6 6l12 12"/></svg>';
                btn.addEventListener('click', () => {
                    builder.items.splice(idx, 1);
                    renderBuilderTags();
                });
                tag.appendChild(span);
                tag.appendChild(btn);
                builderTags.appendChild(tag);
            });
        }

        function builderAddCurrent() {
            const val = builderInput.value.trim();
            if (!val) return;
            builder.items.push(val);
            builderInput.value = '';
            renderBuilderTags();
            builderInput.focus();
        }

        builderAddBtn.addEventListener('click', builderAddCurrent);
        builderInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); builderAddCurrent(); }
        });

        builderCancelBtn.addEventListener('click', closeBuilder);

        builderOkBtn.addEventListener('click', () => {
            if (!builder) return;
            if (builderInput.value.trim()) builderAddCurrent();
            const { type, chipId, items } = builder;
            if (chipId) {
                const chip = findChip(chipId);
                chip.items = items;
            } else {
                state.versionCounters[type] += 1;
                const entry = { id: uid(), kind: 'chip', type, version: state.versionCounters[type], items };
                state.chatLog.push(entry);
                state.activeChipId[type] = entry.id;
            }
            saveState();
            renderChatLog();
            closeBuilder();
        });

        // ---------- Chat input: '/' menu, '@' send ----------
        chatInput.addEventListener('input', () => {
            const val = chatInput.value;
            if (val.startsWith('/')) {
                showCommandMenu(val.slice(1).toLowerCase());
            } else {
                hideCommandMenu();
            }
            if (val === '@') {
                chatInput.value = '';
                hideCommandMenu();
                sendBatch();
            }
        });
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = chatInput.value.trim();
                if (!val) return;
                if (val.startsWith('/')) {
                    const name = val.slice(1).toLowerCase();
                    if (COMMANDS.some(c => c.name === name)) {
                        chatInput.value = '';
                        hideCommandMenu();
                        openBuilder(name, null);
                        return;
                    }
                }
                // Plain text note, kept for context in the log
                state.chatLog.push({ id: uid(), kind: 'note', text: val });
                saveState();
                renderChatLog();
                chatInput.value = '';
                hideCommandMenu();
            }
        });
        plusBtn.addEventListener('click', () => {
            chatInput.value = '/';
            showCommandMenu('');
            chatInput.focus();
        });
        sendBtn.addEventListener('click', () => {
            chatInput.value = '';
            hideCommandMenu();
            sendBatch();
        });

        // ---------- Sending ----------
        function sendBatch() {
            const urlChipId = state.activeChipId.url;
            const urlChip = urlChipId ? findChip(urlChipId) : null;
            const urls = urlChip ? urlChip.items : [];
            if (urls.length === 0) {
                state.chatLog.push({ id: uid(), kind: 'note', text: 'No URL set — use /url first.' });
                saveState();
                renderChatLog();
                return;
            }
            const headersChip = state.activeChipId.headers ? findChip(state.activeChipId.headers) : null;
            const bodyChip = state.activeChipId.body ? findChip(state.activeChipId.body) : null;
            const headersText = headersChip ? headersChip.items.join('\n') : '';
            const bodyText = bodyChip ? bodyChip.items.join('\n') : '';
            const method = methodEl.value;

            const entry = {
                id: uid(),
                kind: 'result',
                method,
                items: urls.map(u => ({ url: u, pending: true, requestId: uid() })),
            };
            state.chatLog.push(entry);
            saveState();
            renderChatLog();

            entry.items.forEach((item, index) => {
                pendingRequests[item.requestId] = { entryId: entry.id, index };
                vscode.postMessage({
                    type: 'sendRequest',
                    requestId: item.requestId,
                    method,
                    url: item.url,
                    headers: headersText,
                    body: bodyText,
                    followRedirects: followRedirects.checked,
                });
            });
        }

        // ---------- Full-screen results ----------
        function openFullscreen(entry) {
            fsTitle.textContent = `${entry.method} · ${entry.items.length} request${entry.items.length === 1 ? '' : 's'}`;
            fsBody.innerHTML = '';
            entry.items.forEach(item => {
                fsBody.appendChild(renderFsItem(entry.method, item));
            });
            fullscreenView.classList.remove('hidden');
        }
        function renderFsItem(method, item) {
            const wrap = document.createElement('div');
            wrap.className = 'fs-item';

            const head = document.createElement('div');
            head.className = 'fs-item-head';
            if (item.pending) {
                head.innerHTML = `<span class="method">${method}</span><span class="url">${item.url}</span><span class="status-pending">pending…</span>`;
            } else if (item.error) {
                head.innerHTML = `<span class="method">${method}</span><span class="url">${item.url}</span><span class="status-err">${item.error}</span>`;
            } else {
                const cls = statusClass(item);
                head.innerHTML = `<span class="method">${method}</span><span class="url">${item.url}</span>` +
                    `<span class="${cls}">${item.statusCode} ${item.statusMessage || ''}</span>` +
                    `<span style="color:var(--fg-dim)">${item.timing || 0}ms</span>` +
                    `<span style="color:var(--fg-dim)">${(item.body || '').length} bytes</span>`;
            }
            wrap.appendChild(head);

            if (!item.pending && !item.error) {
                const reqSection = document.createElement('details');
                reqSection.className = 'fs-section';
                reqSection.innerHTML = `<summary>Response headers</summary><pre>${escapeHtml(JSON.stringify(item.headers || {}, null, 2))}</pre>`;
                wrap.appendChild(reqSection);

                const bodySection = document.createElement('details');
                bodySection.className = 'fs-section';
                bodySection.open = true;
                let bodyText = item.body || '';
                try { bodyText = JSON.stringify(JSON.parse(bodyText), null, 2); } catch {}
                bodySection.innerHTML = `<summary>Response body</summary><pre>${escapeHtml(bodyText)}</pre>`;
                wrap.appendChild(bodySection);
            }
            return wrap;
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        }
        fsBackBtn.addEventListener('click', () => fullscreenView.classList.add('hidden'));

        // ---------- Messages from extension ----------
        window.addEventListener('message', (event) => {
            const msg = event.data;

            if (msg.type === 'response') {
                const pending = pendingRequests[msg.requestId];
                if (!pending) return;
                delete pendingRequests[msg.requestId];
                const entry = state.chatLog.find(e => e.id === pending.entryId);
                if (!entry) return;
                const item = entry.items[pending.index];
                item.pending = false;
                if (msg.data.error) {
                    item.error = msg.data.error;
                } else {
                    Object.assign(item, msg.data);
                    lastResponseForAI = msg.data;
                }
                saveState();
                renderChatLog();
                if (!fullscreenView.classList.contains('hidden') && fsTitle.textContent.startsWith(entry.method)) {
                    openFullscreen(entry);
                }

            } else if (msg.type === 'aiResponse') {
                aiSuggestBtn.disabled = false;
                aiAnalyzeBtn.disabled = false;
                if (msg.data.error) {
                    aiOutput.innerHTML = `<span class="ai-error">${msg.data.error}</span>`;
                    aiTokens.textContent = '';
                } else {
                    aiOutput.textContent = msg.data.content;
                    if (msg.data.promptTokens != null || msg.data.responseTokens != null) {
                        const total = (msg.data.promptTokens || 0) + (msg.data.responseTokens || 0);
                        aiTokens.textContent = `${total} tokens (${msg.data.promptTokens || 0} prompt + ${msg.data.responseTokens || 0} response)`;
                    } else {
                        aiTokens.textContent = '';
                    }
                }

            } else if (msg.type === 'loadRequest') {
                loadRawRequest(msg.data);
            }
        });

        function loadRawRequest(raw) {
            const lines = raw.split('\n');
            let method = 'GET', url = '', headerLines = [], bodyLines = [];
            const firstLine = lines[0] && lines[0].match(/^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\s+(\S+)/i);
            if (firstLine) {
                method = firstLine[1].toUpperCase();
                url = firstLine[2];
                let inBody = false;
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') { inBody = true; continue; }
                    if (inBody) bodyLines.push(lines[i]); else headerLines.push(lines[i]);
                }
            } else {
                url = raw.trim();
            }
            methodEl.value = method;
            if (url) {
                state.versionCounters.url += 1;
                const entry = { id: uid(), kind: 'chip', type: 'url', version: state.versionCounters.url, items: [url] };
                state.chatLog.push(entry);
                state.activeChipId.url = entry.id;
            }
            if (headerLines.length) {
                state.versionCounters.headers += 1;
                const entry = { id: uid(), kind: 'chip', type: 'headers', version: state.versionCounters.headers, items: headerLines };
                state.chatLog.push(entry);
                state.activeChipId.headers = entry.id;
            }
            if (bodyLines.length) {
                state.versionCounters.body += 1;
                const entry = { id: uid(), kind: 'chip', type: 'body', version: state.versionCounters.body, items: [bodyLines.join('\n')] };
                state.chatLog.push(entry);
                state.activeChipId.body = entry.id;
            }
            saveState();
            renderChatLog();
        }

        // ---------- AI assistant ----------
        // Routed through the extension host (Node), not fetch() from the webview --
        // VS Code's webview sandbox blocks direct network calls regardless of CSP.
        const AI_AUTH_KEY = 'hackeraiRepeaterAiAuthorized';

        function aiIsAuthorized() {
            return localStorage.getItem(AI_AUTH_KEY) === 'true';
        }
        function aiShowMain() {
            aiGate.style.display = 'none';
            aiMain.style.display = 'flex';
        }
        if (aiIsAuthorized()) aiShowMain();

        aiToggleBtn.addEventListener('click', () => {
            aiPanel.classList.toggle('collapsed');
            aiToggleBtn.classList.toggle('active', !aiPanel.classList.contains('collapsed'));
        });
        aiAuthCheckbox.addEventListener('change', () => {
            aiEnableBtn.disabled = !aiAuthCheckbox.checked;
        });
        aiEnableBtn.addEventListener('click', () => {
            if (!aiAuthCheckbox.checked) return;
            localStorage.setItem(AI_AUTH_KEY, 'true');
            aiShowMain();
        });

        function callOllama(prompt) {
            aiSuggestBtn.disabled = true;
            aiAnalyzeBtn.disabled = true;
            aiOutput.innerHTML = '<span class="ai-loading">Thinking… (can take a while on CPU)</span>';
            aiTokens.textContent = '';
            vscode.postMessage({ type: 'aiRequest', model: aiModel.value, prompt });
        }

        aiSuggestBtn.addEventListener('click', () => {
            const urlChip = state.activeChipId.url ? findChip(state.activeChipId.url) : null;
            const headersChip = state.activeChipId.headers ? findChip(state.activeChipId.headers) : null;
            const bodyChip = state.activeChipId.body ? findChip(state.activeChipId.body) : null;
            if (!urlChip || urlChip.items.length === 0) {
                aiOutput.innerHTML = '<span class="ai-error">No URL set — use /url first.</span>';
                return;
            }
            const prompt = `Suggest a security-testing payload variant for this HTTP request. ` +
                `Explain briefly why each suggested change is worth trying.\n\n` +
                `Method: ${methodEl.value}\nURL(s):\n${urlChip.items.join('\n')}\n` +
                `Headers:\n${headersChip ? headersChip.items.join('\n') : '(none)'}\n\n` +
                `Body:\n${bodyChip ? bodyChip.items.join('\n') : '(none)'}`;
            callOllama(prompt);
        });

        aiAnalyzeBtn.addEventListener('click', () => {
            if (!lastResponseForAI) {
                aiOutput.innerHTML = '<span class="ai-error">No response yet — send a request first.</span>';
                return;
            }
            const prompt = `Analyze this HTTP response for potential vulnerabilities or interesting behavior ` +
                `(e.g. reflected input, verbose errors, misconfigurations). Be specific about what in the ` +
                `response triggered each observation.\n\n` +
                `Status: ${lastResponseForAI.statusCode} ${lastResponseForAI.statusMessage}\n` +
                `Headers:\n${JSON.stringify(lastResponseForAI.headers, null, 2)}\n\n` +
                `Body:\n${(lastResponseForAI.body || '').slice(0, 8000)}`;
            callOllama(prompt);
        });

        // ---------- Initial render ----------
        renderChatLog();
    </script>
</body>
</html>
